name: pluton_mobile
description: PLUTON Mobile — WrkzCoin mobile wallet powered by WrkzCoin.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
