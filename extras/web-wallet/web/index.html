<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- No maximum-scale/user-scalable: pinch-zoom must stay available. Locking
       it out fails WCAG 1.4.4 and makes 98-character addresses unreadable on
       small screens. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="PLUTON Web — WRKZ Wallet">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1E88E5">
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PLUTON Web">
  <link rel="apple-touch-icon" href="icons/Icon-apple-180.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>PLUTON Web — WRKZ Wallet</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0D1117;
      color: #E6EDF3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #F0F1F3; color: #1A1F2E; }
    }
    /* Boot splash — replaces the blank white screen while the Flutter bundle
       and the ~several-MB WASM module download. Removed once Flutter paints. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      transition: opacity .25s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    #boot img { width: 72px; height: 72px; }
    #boot .spinner {
      width: 26px; height: 26px;
      border: 3px solid rgba(128, 148, 168, .3);
      border-top-color: #1E88E5;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .spinner { animation-duration: 3s; }
    }
    #boot .msg { font-size: 13px; opacity: .75; max-width: 34rem; line-height: 1.5; }
    #boot .err {
      display: none;
      font-size: 13px;
      line-height: 1.6;
      max-width: 34rem;
      color: #E53935;
      border: 1px solid rgba(229, 57, 53, .4);
      background: rgba(229, 57, 53, .08);
      border-radius: 8px;
      padding: 14px 16px;
      text-align: left;
    }
    #boot.failed .spinner, #boot.failed .msg { display: none; }
    #boot.failed .err { display: block; }
    #boot code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
    <div class="msg" id="boot-msg">Loading wallet…</div>
    <div class="err" id="boot-err"></div>
  </div>

  <script>
    // Helper for dart:js_interop to call methods on JS objects by name.
    // Dart's @JS() can only bind to fixed global functions, not dynamic
    // method names on arbitrary objects.
    function _dartCallMethod(obj, name, arg1, arg2) {
      const fn = obj[name];
      if (typeof fn !== 'function') {
        throw new Error('No such method: ' + name);
      }
      if (arg2 !== undefined && arg2 !== null) return fn.call(obj, arg1, arg2);
      if (arg1 !== undefined && arg1 !== null) return fn.call(obj, arg1);
      return fn.call(obj);
    }
    window._dartCallMethod = _dartCallMethod;

    // Helper for dart:js_interop to extract a readable message from a JS
    // Error (or any thrown value) that comes back via a rejected Promise.
    function _extractJsError(err) {
      if (!err) return 'Unknown error';
      if (typeof err === 'string') return err;
      if (err.message) return String(err.message);
      return String(err);
    }
    window._extractJsError = _extractJsError;

    // Boot splash control. Dart clears this once the first frame is painted.
    window._bootStatus = function (text) {
      const el = document.getElementById('boot-msg');
      if (el) el.textContent = text;
    };
    window._bootFailed = function (message, hint) {
      const boot = document.getElementById('boot');
      const err = document.getElementById('boot-err');
      if (!boot || !err) return;
      err.innerHTML = '<strong>The wallet could not start.</strong><br>' +
        '<code></code><br><br><span></span>';
      err.querySelector('code').textContent = message || 'Unknown error';
      err.querySelector('span').textContent = hint || '';
      boot.classList.add('failed');
    };
    window._bootDone = function () {
      const boot = document.getElementById('boot');
      if (!boot || boot.classList.contains('failed')) return;
      boot.classList.add('hidden');
      setTimeout(function () { if (boot.parentNode) boot.remove(); }, 300);
    };
  </script>

  <!--
    Load the WASM wallet module.
    wallet_wasm.js + wallet_wasm.wasm must be placed in web/ alongside this file.
    If using pthreads, wallet_wasm.worker.js is also required.

    IMPORTANT: For SharedArrayBuffer (pthreads) support, the web server must
    send these headers:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
  -->
  <script type="module">
    import { WalletBridgeWorker } from './wallet_bridge.js';

    // Create a worker-based bridge — all WASM calls run off the main thread
    const walletBridge = new WalletBridgeWorker();

    // Make it available globally for dart:js_interop
    window.walletBridge = walletBridge;
    window.walletBridgeReady = false;
    window.walletBridgeError = null;

    window._bootStatus('Loading wallet engine…');

    // Spawn the web worker and initialize the WASM module inside it
    walletBridge.init('./wallet_worker.js', './wallet_wasm.js').then(() => {
      console.log('WRKZ WASM wallet module loaded (via Web Worker)');
      window.walletBridgeReady = true;
      window.dispatchEvent(new Event('walletBridgeReady'));
    }).catch((err) => {
      console.error('Failed to load WASM wallet module:', err);
      // Record the message so the Dart side can stop waiting and report it,
      // rather than polling walletBridgeReady forever behind a spinner.
      window.walletBridgeError = _extractJsError(err);
      window.dispatchEvent(new Event('walletBridgeFailed'));
      window._bootFailed(
        window.walletBridgeError,
        'Check that wallet_wasm.js and wallet_wasm.wasm are present in the same ' +
        'directory as index.html, and that the server sends the ' +
        'Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers.');
    });
  </script>

  <!-- Flutter's modern bootstrap. Replaces the deprecated
       _flutter.loader.loadEntrypoint() flow; generated by `flutter build web`. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
