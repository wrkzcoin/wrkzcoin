<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrkz Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="shell">
    <header class="topbar reveal">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div>
          <h1>Wrkz Block Explorer</h1>
          <p>Lightweight + indexed search</p>
        </div>
      </div>
      <div class="status" id="healthStatus">Checking health...</div>
    </header>

    <main class="content">
      <section class="panel reveal">
        <h2>Search</h2>
        <form id="searchForm" class="search-form">
          <input id="searchInput" type="text" placeholder="Block height/hash, tx hash, or payment ID" autocomplete="off">
          <button type="submit">Lookup</button>
        </form>
        <p class="hint">Block: height/hash. Tx: tx hash or payment ID (short/long).</p>
      </section>

      <section class="grid-2">
        <article class="panel reveal">
          <h2>Network</h2>
          <div class="cards" id="networkCards">
            <div class="card"><span>Height</span><strong>-</strong></div>
            <div class="card"><span>Network Height</span><strong>-</strong></div>
            <div class="card"><span>Hashrate</span><strong>-</strong></div>
            <div class="card"><span>Difficulty</span><strong>-</strong></div>
          </div>
        </article>

        <article class="panel reveal">
          <h2>Indexer</h2>
          <div class="cards" id="indexCards">
            <div class="card"><span>Indexed Tip</span><strong>-</strong></div>
            <div class="card"><span>Lag</span><strong>-</strong></div>
            <div class="card"><span>Payment IDs</span><strong>-</strong></div>
            <div class="card"><span>Last Sync</span><strong>-</strong></div>
          </div>
        </article>
      </section>

      <section class="panel reveal">
        <div class="results-head">
          <h2>Result</h2>
          <button id="refreshBtn" type="button" class="ghost">Refresh</button>
        </div>
        <pre id="resultBox" class="result-box">No query yet.</pre>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
