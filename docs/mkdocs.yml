site_name: WrkzCoin Documentation
# Overridable so an archived build can declare its own canonical URL:
# DOCS_SITE_URL=https://docs.wrkz.work/v0.4.8/ mkdocs build
site_url: !ENV [DOCS_SITE_URL, "https://docs.wrkz.work/"]
site_description: Daemon RPC, wallet RPC, and operator guides for WrkzCoin
site_author: The WrkzCoin Developers
copyright: Copyright &copy; 2018-2026 The WrkzCoin Developers

repo_url: https://github.com/wrkzcoin/wrkzcoin
repo_name: wrkzcoin/wrkzcoin
edit_uri: edit/development/docs/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - minify:
      minify_html: true

# Emits llms.txt, llms-full.txt and a raw .md mirror of every page into the
# built site, so an AI agent can read the docs without scraping HTML.
hooks:
  - hooks/llms_txt.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  # Reads /versions.json at the domain root. The live docs are served from the
  # root itself, which has no path segment for the selector to match against,
  # so Material falls back to the FIRST entry in that file - keep the current
  # release first. scripts/docs/publish.sh maintains it.
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/KN8PjyuvG4
      name: WrkzCoin on Discord
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/wrkzcoin
      name: WrkzCoin on X
    - icon: fontawesome/brands/github
      link: https://github.com/wrkzcoin
      name: WrkzCoin on GitHub

nav:
  - Home: index.md
  - Node Operator:
      - Running a Node: guides/running-daemon.md
      - Configuration Reference: guides/daemon-configuration.md
      - Console Commands: guides/console-commands.md
      - Networking: guides/networking.md
      - Local IPC and Console: guides/ipc-and-console.md
      - Notification Hooks: guides/notify-hooks.md
      - Lite Nodes: guides/lite-node.md
      - Lite Node Snapshots: guides/lite-snapshots.md
      - Solo Mining: guides/solo-mining.md
      - Security Hardening: guides/security-hardening.md
      - Rate Limits and Performance: guides/rate-limits-and-performance.md
  - Daemon RPC:
      - Overview: daemon-rpc/overview.md
      - Auth and Security: daemon-rpc/auth-and-security.md
      - JSON-RPC Methods: daemon-rpc/json-rpc.md
      - HTTP Endpoints: daemon-rpc/http-endpoints.md
      - Cookbook: guides/daemon-rpc-cookbook.md
  - Wallet API RPC:
      - Overview: wallet-api/overview.md
      - Running Wallet API: guides/running-wallet-api.md
      - Auth and Security: wallet-api/auth-and-security.md
      - Endpoints: wallet-api/endpoints.md
      - Cookbook: guides/wallet-api-cookbook.md
  - Wallet Service JSON-RPC:
      - Overview: wallet-service-json-rpc/overview.md
      - Methods: wallet-service-json-rpc/methods.md
  - Wallets:
      - Wallet CLI: guides/wallet-cli.md
      - Wallet CLI Command Reference: guides/cli-command-reference.md
      - Desktop, Mobile and Web Wallets: guides/wallet-apps.md
      - Encrypted Payment IDs: guides/encrypted-payment-ids.md
      - Transaction PoW Server: guides/txpow-server.md
  - Building and Tools:
      - Building from Source: guides/building.md
      - Building the Wallet Apps: guides/building-wallet-apps.md
      - The Miner App: guides/miner.md
      - Other Tools: guides/other-tools.md
  - Reference:
      - Network Parameters: guides/network-parameters.md
      - Wallet Error Codes: guides/error-codes.md
  - Changelog:
      - Daemon: changelog/daemon.md
      - Wallet API: changelog/wallet-api.md
  - Community: community.md
